<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Arellano University — Midnight</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&family=Nunito:ital,wght@0,400;0,600;0,700;1,400&display=swap" rel="stylesheet">
<style>

  /* ============================================================
     HOW TO ADD YOUR OWN IMAGES
     ------------------------------------------------------------
     Scroll down to the "IMAGES" object inside the <script> tag
     near the bottom of this file. Each scene has a "bg" slot
     (background image) and some scenes have a "char" slot
     (character portrait). Put a filename or path there, e.g.:

         bg: "images/gate.jpg"
         char: "images/dutae.png"

     Leave a slot as an empty string "" to keep the built-in
     placeholder gradient/silhouette. That's the ONLY place you
     need to touch to swap in real art.
     ============================================================ */

  :root{
    --void:#1c130c;        /* dark letterbox behind the scene art */
    --panel:#fdf3de;       /* warm cream storybook card */
    --panel-edge:#e2703a;  /* terracotta border / accent */
    --ink:#3a2a1a;         /* main text — warm dark brown */
    --ink-dim:#8a7458;     /* secondary / muted text */
    --blood:#e2532a;       /* primary accent — question text, danger */
    --blood-bright:#ff6b3d;
    --rot:#2f8f8a;         /* secondary accent — calm / safe */
    --rot-bright:#4fc3bd;
    --gold:#f0b429;        /* sunny yellow — buttons, highlights */
    --sky:#7ec8e3;         /* title screen sky */
    --grass:#5ba75c;       /* small green touches */
  }

  *{box-sizing:border-box;}

  html,body{
    margin:0;
    padding:0;
    height:100%;
    background:var(--void);
    font-family:'Nunito', sans-serif;
    color:var(--ink);
    overflow:hidden;
  }

  #app{
    position:relative;
    width:100%;
    height:100vh;
    max-height:100dvh;
    display:flex;
    flex-direction:column;
    background:#000;
  }

  /* ---------- Background layer (fills entire screen, sits behind everything) ---------- */
  #bg-layer{
    position:absolute;
    inset:0;
    z-index:0;
    background-size:cover;
    background-position:center;
    transition:opacity 0.9s ease;
  }

  /* ---------- Stage: the space ABOVE the text box, where the character stands ---------- */
  #stage{
    position:relative;
    z-index:1;
    flex:1 1 auto;
    min-height:0;
  }

  #bg-layer.grain::after{
    content:"";
    position:absolute;
    inset:0;
    background-image:
      radial-gradient(ellipse at 50% 30%, rgba(0,0,0,0) 0%, rgba(0,0,0,0.75) 100%);
    pointer-events:none;
  }

  #bg-layer::before{
    content:"";
    position:absolute;
    inset:0;
    opacity:0.06;
    background-image:
      repeating-linear-gradient(0deg, rgba(255,255,255,0.4) 0px, transparent 1px, transparent 2px, rgba(255,255,255,0.4) 3px);
    mix-blend-mode:overlay;
    pointer-events:none;
    animation:flicker 6s infinite steps(20);
  }

  @keyframes flicker{
    0%,100%{opacity:0.04;}
    50%{opacity:0.09;}
    52%{opacity:0.02;}
  }

  /* placeholder gradients — used when no image is supplied */
  .bg-gate{background:radial-gradient(ellipse at 50% 20%, #241c2e 0%, #100c15 55%, #05040a 100%);}
  .bg-corridor{background:linear-gradient(180deg, #1b1a17 0%, #0d0c0a 60%, #050504 100%);}
  .bg-lit-room{background:radial-gradient(circle at 50% 35%, #4a3a1c 0%, #1a140a 45%, #06050a 100%);}
  .bg-water{background:linear-gradient(180deg, #0e1c1a 0%, #081513 55%, #030605 100%);}
  .bg-chase{background:radial-gradient(circle at 50% 60%, #3a0c10 0%, #1a0507 50%, #050404 100%);}
  .bg-dawn{background:linear-gradient(180deg, #3a2a2a 0%, #6b4530 45%, #a06a3a 75%, #d99a55 100%);}
  .bg-void{background:radial-gradient(circle at 50% 50%, #150808 0%, #050303 70%);}

  /* ---------- Character portrait ---------- */
  #char-layer{
    position:absolute;
    bottom:0;
    left:50%;
    transform:translateX(-50%);
    width:min(60vw, 340px);
    height:92%;
    display:flex;
    align-items:flex-end;
    justify-content:center;
    opacity:0;
    transition:opacity 0.6s ease, transform 0.6s ease;
    pointer-events:none;
    filter:drop-shadow(0 10px 30px rgba(0,0,0,0.8));
  }
  #char-layer.show{opacity:1;}

  #char-layer img{
    max-width:100%;
    max-height:100%;
    width:auto;
    height:auto;
    display:block;
    object-fit:contain;
  }

  .char-placeholder{
    width:100%;
    aspect-ratio:2/3;
    border-radius:16px 16px 0 0;
    background:linear-gradient(180deg, #fff8ea, #f3dfb8);
    border:3px solid var(--panel-edge);
    display:flex;
    align-items:center;
    justify-content:center;
    text-align:center;
    padding:1rem;
    color:var(--ink-dim);
    font-family:'Baloo 2', sans-serif;
    font-weight:600;
    letter-spacing:0.02em;
    font-size:0.85rem;
    text-transform:none;
  }

  .char-placeholder .eyes{
    position:absolute;
    display:flex;
    gap:1.4rem;
    top:38%;
  }
  .char-placeholder .eyes span{
    width:8px;height:8px;border-radius:50%;
    background:var(--rot-bright);
    box-shadow:0 0 12px 3px var(--rot-bright);
  }
  .char-placeholder.eyes-blood .eyes span{
    background:var(--blood-bright);
    box-shadow:0 0 12px 3px var(--blood-bright);
  }

  #story-panel{
    position:relative;
    z-index:2;
    flex:0 0 auto;
    width:calc(100% - 1.4rem);
    max-width:680px;
    margin:0 auto calc(0.7rem + env(safe-area-inset-bottom));
    padding:1.1rem 1.3rem 1.3rem;
    background:var(--panel);
    border:3px solid var(--panel-edge);
    border-radius:20px;
    box-shadow:0 12px 30px rgba(0,0,0,0.45), 0 2px 0 rgba(255,255,255,0.5) inset;
  }

  #scene-label{
    font-family:'Baloo 2', sans-serif;
    font-weight:700;
    font-size:0.72rem;
    letter-spacing:0.14em;
    text-transform:uppercase;
    color:var(--rot);
    margin-bottom:0.5rem;
    opacity:0.9;
  }

  #story-text{
    font-size:1.08rem;
    line-height:1.55;
    color:var(--ink);
    margin-bottom:0.9rem;
    min-height:2.5em;
  }

  #story-text .beat{
    display:block;
    margin-bottom:0.5rem;
  }

  #question-text{
    font-family:'Baloo 2', sans-serif;
    font-weight:700;
    font-size:0.98rem;
    letter-spacing:0.01em;
    color:var(--blood);
    margin-bottom:0.8rem;
    font-style:normal;
  }

  #choices{
    display:flex;
    flex-direction:column;
    gap:0.6rem;
  }

  .choice-btn{
    font-family:'Nunito', sans-serif;
    font-weight:700;
    font-size:1.02rem;
    text-align:left;
    background:linear-gradient(180deg, #ffe8a8, #f7c85e);
    border:2px solid #d99a2b;
    color:#4a2f10;
    padding:0.75rem 1rem;
    border-radius:14px;
    cursor:pointer;
    transition:all 0.15s ease;
    position:relative;
    overflow:hidden;
    box-shadow:0 3px 0 #b87a1e;
  }

  .choice-btn:hover, .choice-btn:focus-visible{
    background:linear-gradient(180deg, #fff0c0, #ffd876);
    transform:translateY(-1px);
    outline:none;
  }

  .choice-btn:active{
    transform:translateY(2px);
    box-shadow:0 1px 0 #b87a1e;
  }

  /* ---------- Ending screen ---------- */
  #ending-title{
    font-family:'Baloo 2', sans-serif;
    font-weight:800;
    font-size:clamp(1.5rem, 7vw, 2.4rem);
    letter-spacing:0.01em;
    text-transform:none;
    color:var(--blood);
    text-align:center;
    margin:0 0 0.4rem 0;
  }

  #ending-title.safe{
    color:var(--rot);
  }

  .ending-wrap{
    text-align:center;
  }

  .ending-divider{
    width:50px;
    height:3px;
    border-radius:2px;
    background:var(--gold);
    margin:0.5rem auto 1rem;
  }

  #play-again{
    font-family:'Baloo 2', sans-serif;
    font-weight:700;
    letter-spacing:0.02em;
    text-transform:none;
    font-size:0.95rem;
    background:var(--rot);
    border:2px solid #226863;
    color:#fff;
    padding:0.7rem 1.8rem;
    border-radius:14px;
    cursor:pointer;
    margin-top:0.6rem;
    transition:all 0.15s ease;
    box-shadow:0 3px 0 #1a4d49;
  }
  #play-again:hover{
    background:var(--rot-bright);
    transform:translateY(-1px);
  }
  #play-again:active{
    transform:translateY(2px);
    box-shadow:0 1px 0 #1a4d49;
  }

  /* ---------- Title screen ---------- */
  #title-screen{
    position:absolute;
    inset:0;
    z-index:10;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    background:linear-gradient(180deg, var(--sky) 0%, #bfe3ee 45%, #f3dfb0 100%);
    text-align:center;
    padding:2rem;
  }

  #title-screen h1{
    font-family:'Baloo 2', sans-serif;
    font-weight:800;
    font-size:clamp(1.7rem, 8vw, 3rem);
    letter-spacing:0.01em;
    color:#2a4d3a;
    margin:0 0 0.2rem;
    text-shadow:0 3px 0 rgba(255,255,255,0.5);
  }
  #title-screen .sub{
    font-family:'Baloo 2', sans-serif;
    font-weight:600;
    color:var(--blood);
    letter-spacing:0.1em;
    font-size:0.9rem;
    text-transform:uppercase;
    margin-bottom:2.4rem;
  }

  #start-btn{
    font-family:'Baloo 2', sans-serif;
    font-weight:700;
    letter-spacing:0.02em;
    text-transform:none;
    font-size:1rem;
    background:linear-gradient(180deg, #ffe8a8, #f7c85e);
    border:2px solid #d99a2b;
    color:#4a2f10;
    padding:0.85rem 2.2rem;
    border-radius:16px;
    cursor:pointer;
    transition:all 0.15s ease;
    box-shadow:0 4px 0 #b87a1e;
  }
  #start-btn:hover{
    transform:translateY(-1px);
  }
  #start-btn:active{
    transform:translateY(3px);
    box-shadow:0 1px 0 #b87a1e;
  }

  .hidden{display:none !important;}

  @media (max-width:400px){
    #story-text{font-size:1rem;}
    .choice-btn{font-size:0.95rem; padding:0.65rem 0.85rem;}
  }
</style>
</head>
<body>

<div id="app">

  <!-- TITLE SCREEN -->
  <div id="title-screen">
    <h1>Arellano University</h1>
    <div class="sub">Midnight</div>
    <button id="start-btn">Enter, if you dare</button>
  </div>

  <div id="bg-layer" class="grain"></div>

  <div id="stage">
    <div id="char-layer"></div>
  </div>

  <div id="story-panel">
    <div id="scene-label"></div>
    <div id="story-text"></div>
    <div id="question-text"></div>
    <div id="choices"></div>
  </div>

</div>

  /* ---------- Engine ---------- */
  const bgLayer = document.getElementById("bg-layer");
  const charLayer = document.getElementById("char-layer");
  const sceneLabel = document.getElementById("scene-label");
  const storyText = document.getElementById("story-text");
  const questionText = document.getElementById("question-text");
  const choicesEl = document.getElementById("choices");
  const titleScreen = document.getElementById("title-screen");
  const startBtn = document.getElementById("start-btn");

  function renderBackground(scene){
    bgLayer.className = "grain " + scene.bgClass;
    if (scene.bg){
      bgLayer.style.backgroundImage = `url("${scene.bg}")`;
    } else {
      bgLayer.style.backgroundImage = "";
    }
  }

  function renderCharacter(scene){
    charLayer.innerHTML = "";
    charLayer.classList.remove("show");
    if (!scene.char) return;

    const path = IMAGES.characters[scene.char];
    if (path){
      const img = document.createElement("img");
      img.src = path;
      img.alt = scene.charLabel || scene.char;
      charLayer.appendChild(img);
    } else {
      const div = document.createElement("div");
      div.className = "char-placeholder" + (scene.charEyes === "blood" ? " eyes-blood" : "");
      div.style.position = "relative";
      div.innerHTML = `<span>${scene.charLabel || scene.char}</span>
        <div class="eyes"><span></span><span></span></div>`;
      charLayer.appendChild(div);
    }
    requestAnimationFrame(() => charLayer.classList.add("show"));
  }

  function renderChoices(scene){
    choicesEl.innerHTML = "";
    if (scene.ending){
      const btn = document.createElement("button");
      btn.id = "play-again";
      btn.textContent = "Play Again";
      btn.onclick = () => goTo("gate");
      choicesEl.appendChild(btn);
      return;
    }
    scene.choices.forEach(choice => {
      const btn = document.createElement("button");
      btn.className = "choice-btn";
      btn.textContent = choice.text;
      btn.onclick = () => goTo(choice.next);
      choicesEl.appendChild(btn);
    });
  }

  function goTo(sceneId){
    const scene = SCENES[sceneId];
    if (!scene) return;

    renderBackground(scene);
    renderCharacter(scene);

    sceneLabel.textContent = scene.label || "";

    storyText.innerHTML = scene.text.map(line => `<span class="beat">${line}</span>`).join("");

    if (scene.ending){
      questionText.innerHTML = "";
      sceneLabel.innerHTML = "";
      storyText.innerHTML += `<div class="ending-wrap" style="margin-top:1rem;">
        <div id="ending-title" class="${scene.ending.tone === 'safe' ? 'safe' : ''}">${scene.ending.title}</div>
        <div class="ending-divider"></div>
      </div>`;
    } else {
      questionText.textContent = scene.question || "";
    }

    renderChoices(scene);
  }

  startBtn.addEventListener("click", () => {
    titleScreen.classList.add("hidden");
    goTo("gate");
  });

</script>
</body>
</html>
